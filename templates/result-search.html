{% extends 'base.html' %}

{% block content %}
<div class="flex justify-between items-center cursor-pointer" id="btn-input">
    <h2 class="text-dark font-semibold text-[40px]">Produk Terlaris Sekarang</h2>
    <div class="flex justify-between items-center w-full max-w-2xl gap-3 px-4 py-3 bg-white border border-slate-800 rounded-lg focus-within:border-umkm-primary focus-within:ring-1 focus-within:ring-umkm-primary transition-all shadow-sm">
        <div class="flex gap-x-3.75">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search text-slate-400"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
            <input 
                readonly
                type="text" 
                name="search"
                placeholder="Cari Produk" 
                class="w-full bg-transparent text-umkm-dark placeholder-slate-400 focus:outline-none text-lg font-medium cursor-pointer">
        </div>
        <div class="p-2.5 bg-dark rounded-[50px] w-fit h-fit">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal-icon lucide-sliders-horizontal text-[#919CAD]"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
        </div>
    </div>
</div>
<div class="w-full h-fit flex gap-4.25 flex-wrap justify-around">
    <div class="border border-dark w-[384px] h-[470px] p-3.75 rounded-[15px] stroke-dark stroke-[0.5px] flex flex-col justify-between items-center">
        <div class="w-full h-fit flex flex-col gap-y-2.5">
            <div class="w-full h-41.75 bg-dark rounded-[15px] overflow-hidden flex items-center justify-center">
                <img src="{{ url_for('static', filename='images/parfume_product.png') }}" class="border border-blue-600" alt="">
                <!-- <img src="{{ url_for('static', filename='images/parfume_product.png') }}" class="w-full h-full object-cover object-center border border-blue-600" alt=""> -->
            </div>
            <div class="w-full h-fit flex flex-col gap-2">
                <div class="w-full h-fit flex flex-col gap-x-1.25">
                    <p id="category" class="text-slate-400 text-14 mb-0 font-medium">Parfume</p>
                    <p id="name" class="text-dark text-[24px] font-medium mb-0">Parfume Eu De Light</p>
                </div>
                <p class="text-dark text-[28px] font-bold mb-0">Rp. 5.000.000</p>
            </div>
        </div>
        <div class="w-full h-fit flex flex-col gap-y-2.5">
            <div class="w-full h-fit flex gap-x-2.5 items-center">
                <div class="w-fit h-fit flex gap-x-1.25 items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star-icon lucide-star text-accent"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                    <p class="text-dark text-sm font-medium">5</p>
                </div>
                <div class="w-fit h-fit flex gap-x-1.25 items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart text-pink"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                    <p class="text-dark text-sm font-medium">3002</p>
                </div>
            </div>
            <div class="w-full h-fit flex justify-center items-center gap-2.5">
                <a href="" class="w-full h-fit bg-dark rounded-[5px] px-5 py-3.75 text-secondary font-medium text-lg no-underline text-center">Beli Sekarang</a>
                <div class="w-fit h-fit flex gap-x-2.5 items-center">
                    <div class="w-fit h-fit p-3.75 rounded-[5px] border border-pink">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart text-pink"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                    </div>
                    <div class="w-fit h-fit p-3.75 rounded-[5px] border border-dark">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart-icon lucide-shopping-cart text-dark"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="hidden rounded-[15px] z-10 w-[95%] fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 h-fit px-[28px] py-[44px] bg-white rounder-[15px] shadow-md flex flex-col gap-y-9 self-center" id="search-modal">
    <div class="w-full h-fit flex justify-between">
        <h4 class="text-4xl font-semibold">Cari Produk yang Kamu Inginkan</h4>
        <svg id="close-modal" xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-x-icon lucide-circle-x rounder-[60px]"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
    </div>
    <div class="flex items-center w-full gap-3 px-4 py-4 bg-white border border-slate-800 rounded-lg focus-within:border-umkm-primary focus-within:ring-1 focus-within:ring-umkm-primary transition-all shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search text-slate-400"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        <input 
            id="real-search-input"
            type="text" 
            name="search"
            placeholder="Cari Produk" 
            class="w-full bg-transparent text-umkm-dark placeholder-slate-400 focus:outline-none text-lg font-medium">
    </div>
    <div class="w-full h-fit flex justify-between items-start">
        <div class="w-[40%] h-fit flex flex-col gap-y-1.5">
            <h4 class="text-2xl font-medium">Filter Harga</h4>
            <div class="w-full h-fit flex gap-x-2.5 p-1.5">
                <input 
                    type="text" 
                    name="min-price"
                    placeholder="Min: Rp. 10.000" 
                    class="border border-slate-800 rounded-[50px] px-4 py-2 w-full bg-transparent text-umkm-dark placeholder-slate-400 focus:outline-none text-lg font-medium">
                <input 
                    type="text" 
                    name="max-price"
                    placeholder="Min: Rp. 20.000" 
                    class="border border-slate-800 rounded-[50px] px-4 py-2 w-full bg-transparent text-umkm-dark placeholder-slate-400 focus:outline-none text-lg font-medium">
            </div>
        </div>
        <div class="w-[55%] flex gap-x-2.5">
            <div class="w-[260px] h-fit flex flex-col gap-y-2.5">
                <h4 class="text-2xl font-medium">Kategori</h4>
                <div class="relative">
                    <select name="kategori" id="kategori" class="w-full appearance-none bg-white border border-slate-400 rounded-lg px-4 py-2 pr-10 text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent cursor-pointer">
                        <option value="" disabled selected>Pilih Kategori</option>
                        <option value="aksjak">jaksasja</option>
                        <option value="kategori1">Kategori 1</option>
                        <option value="kategori2">Kategori 2</option>
                        <option value="kategori3">Kategori 3</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down-icon lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
            </div>
            <div class="w-[260px] h-fit flex flex-col gap-y-2.5">
                <h4 class="text-2xl font-medium">Tipe</h4>
                <div class="relative">
                    <select name="kategori" id="kategori" class="w-full appearance-none bg-white border border-slate-400 rounded-lg px-4 py-2 pr-10 text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent cursor-pointer">
                        <option value="" disabled selected>Pilih Tipe</option>
                        <option value="aksjak">jaksasja</option>
                        <option value="kategori1">Kategori 1</option>
                        <option value="kategori2">Kategori 2</option>
                        <option value="kategori3">Kategori 3</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down-icon lucide-chevron-down"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="w-full h-fit flex flex-col gap-y-1.5">
        <h4 class="text-2xl font-medium">Tipe</h4>
        <div class="w-full h-fit">
            <div class="w-full h-fit flex justify-between border-b-4 border-b-dark rounded-lg py-2.5 ps-1 pe-2">
                <p class="mb-0 text-lg font-normal text-slate-400">Parfume Eu De Light</p>
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
            <div class="w-full h-fit flex justify-between border-b-4 border-b-dark rounded-lg py-2.5 ps-1 pe-2">
                <p class="mb-0 text-lg font-normal text-slate-400">Parfume Eu De Light</p>
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
            <div class="w-full h-fit flex justify-between border-b-4 border-b-dark rounded-lg py-2.5 ps-1 pe-2">
                <p class="mb-0 text-lg font-normal text-slate-400">Parfume Eu De Light</p>
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </div>
        </div>
    </div>
</div>
<div class="fixed inset-0 bg-dark opacity-20 z-1 hidden" id="overlay-body"></div>
{% endblock %}
